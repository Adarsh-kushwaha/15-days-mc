<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>FSD November Sprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: a code editor inside a browser window. Address bar = route, syntax-highlight hues = roadmap layers, amber = missed work */
/* Single dark theme by choice, matching the Frontend Master components page: warm near-black, gold accent, pastel per-category hues on tinted cards */
:root{
  --bg:#15130f; --surface:#1d1a15; --raised:#26221b; --line:#37312a; --fg:#f1ece2; --muted:#a59c8c;
  --accent:#e8c35a; --accent-ink:#1a1610; --warn:#ffb020; --warn-bg:#2b2112; --ok:#6fd49a; --ok-ink:#10160f; --idle:#2e2922;
  --t-blue:#79aaf0; --t-cyan:#3ec9d6; --t-pink:#f28aa8; --t-orange:#f0a35a; --t-green:#6fd49a; --t-purple:#a9a4f5; --t-red:#f07a92; --t-amber:#b5d45a; --t-grey:#cdbfa5; --t-teal:#5fd0b8;
  --glow:rgba(232,195,90,.10); --code-bg:#2e2716;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",sans-serif;
  --f-body:"Geist","Inter","Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.6 var(--f-body);background-image:radial-gradient(1100px 520px at 15% -160px,var(--glow),transparent 70%),radial-gradient(700px 380px at 95% 10%,rgba(240,163,90,.06),transparent 70%);background-repeat:no-repeat}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--accent)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* browser chrome header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.chrome{display:flex;align-items:center;gap:12px;padding-block:10px 8px}
.lights{display:flex;gap:6px;flex:none}
.lights i{width:11px;height:11px;border-radius:50%;display:block}
.lights i:nth-child(1){background:var(--t-red)}.lights i:nth-child(2){background:var(--t-amber)}.lights i:nth-child(3){background:var(--t-green)}
.addr{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font:500 .78rem var(--f-mono);color:var(--muted);overflow:hidden;white-space:nowrap}
.addr b{color:var(--fg);font-weight:500}
.addr .lock{color:var(--ok)}
.clock{flex:none;font:500 .78rem var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;line-height:1.3}
.clock b{color:var(--fg);display:block;font-weight:700}
.topin{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding-block:6px 10px}
.brand{display:flex;flex-direction:column;min-width:0}
.brand h1{font:800 1.3rem/1.1 var(--f-display);margin:0;letter-spacing:-.03em;color:var(--accent)}
.brand h1 span{color:var(--fg)!important}
.brand h1 span{color:var(--accent)}
.brand small{color:var(--muted);font:500 .74rem var(--f-mono)}
.meter{flex:1 1 260px;display:flex;flex-direction:column;gap:6px;min-width:0}
.meter .row{display:flex;justify-content:space-between;gap:8px;font:500 .76rem var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.meter .row b{color:var(--fg)}
.stack{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--idle)}
.stack span{display:block;height:100%}
.sync{font:500 .7rem var(--f-mono);color:var(--muted)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-bottom:-1px}
nav.tabs a{padding:8px 14px;text-decoration:none;color:var(--muted);font:600 .82rem var(--f-mono);white-space:nowrap;border:1px solid transparent;border-bottom:0;border-radius:8px 8px 0 0;display:inline-flex;align-items:center;gap:6px}
nav.tabs a:hover{color:var(--fg)}
nav.tabs a[aria-current="page"]{background:var(--bg);color:var(--accent);border-color:var(--line)}
.badge{background:var(--warn);color:var(--accent-ink);border-radius:999px;font:700 .68rem var(--f-mono);padding:0 6px;line-height:1.5}

main{padding-block:26px 72px}
h2{font:800 clamp(1.9rem,4.4vw,2.8rem)/1.05 var(--f-display);margin:0 0 8px;text-wrap:balance;letter-spacing:-.045em}
h2 em{font-style:normal;color:var(--accent)}
h3{font:700 1.05rem/1.3 var(--f-display);margin:0;text-wrap:balance}
.lede{color:var(--muted);margin:0 0 20px;max-width:68ch}
.lede b{color:var(--fg)}
.eyebrow{font:500 .74rem var(--f-mono);color:var(--muted)}
.eyebrow::before{content:"// ";opacity:.7}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 .72rem var(--f-body);padding:3px 11px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;background:var(--raised);color:var(--fg)}
.chip.full{border-color:var(--accent);color:var(--accent)}
.chip.core{color:var(--ok);border-color:var(--ok)}
.chip.stretch{color:var(--t-amber);border-color:var(--t-amber)}
.chip.skip{color:var(--muted)}
.chip.warn{color:var(--warn);border-color:var(--warn)}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block;flex:none}

/* banners */
.banner{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--warn);background:var(--warn-bg);border-radius:10px;padding:12px 14px;margin-bottom:18px}
.banner .wd{width:10px;height:10px;border-radius:50%;background:var(--warn);margin-top:7px;flex:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--warn) 25%,transparent)}
.banner p{margin:0}
.banner b{font-family:var(--f-display)}
.banner.okb{border-color:var(--ok);background:var(--surface)}
.banner.okb .wd{background:var(--ok);box-shadow:none}

/* Today */
.dayhead{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.daynav{display:flex;gap:6px}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:8px;cursor:pointer;font:600 .84rem var(--f-body);text-decoration:none;display:inline-flex;align-items:center;gap:6px;color:var(--fg)}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);border-radius:999px}
code,.code{font:500 .85em var(--f-mono);background:var(--code-bg);color:var(--accent);padding:1px 6px;border-radius:5px}
.btn.sm{padding:4px 10px;font-size:.78rem}
.frame{display:flex;gap:3px;height:24px;margin:4px 0 18px}
.frame span{flex-basis:0;border-radius:4px;position:relative}
.frame span em{position:absolute;left:6px;top:3px;font:700 .66rem var(--f-mono);font-style:normal;color:var(--accent-ink);white-space:nowrap;overflow:hidden;right:2px;text-overflow:ellipsis}
.callout{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:12px 14px;margin-bottom:18px;font:500 .86rem/1.6 var(--f-mono);color:var(--muted)}
.callout b{color:var(--fg)}

.topic{--tc:var(--accent);background:linear-gradient(100deg,color-mix(in srgb,var(--tc) 13%,var(--surface)),var(--surface) 46%);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden;transition:border-color .15s}
.topic .tmeta .tn{color:var(--tc);font-weight:700}
.topic:hover{border-color:color-mix(in srgb,var(--tc) 55%,var(--line))}
.topic>.th{display:grid;grid-template-columns:4px 1fr auto;gap:0 14px;align-items:stretch;cursor:pointer}
.topic .tmain{padding:12px 0;min-width:0}
.topic .tmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:5px;font:500 .74rem var(--f-mono);color:var(--muted)}
.topic .tright{display:flex;align-items:center;gap:6px;padding-right:12px}
.stages{display:flex;gap:4px}
.stage{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:6px;padding:3px 8px;font:600 .7rem var(--f-mono);cursor:pointer;background:var(--bg);user-select:none;color:var(--muted)}
.stage input{position:absolute;opacity:0;pointer-events:none}
.stage.on{background:var(--ok);font-weight:700;border-color:var(--ok);color:var(--ok-ink)}
.stage:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:1px}
.tbody{border-top:1px solid var(--line);padding:14px 16px 16px 20px;display:grid;gap:14px;background:var(--surface)}
.tbody[hidden]{display:none!important}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tgrid>div{min-width:0}
.tbody p{margin:2px 0 0}
.tbody ol{margin:4px 0 0;padding-left:20px}
.tbody li{margin-bottom:4px}
.linkrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.linkrow input{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 9px;font:.78rem var(--f-mono)}
textarea{width:100%;min-height:80px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px;resize:vertical;font:.88rem/1.5 var(--f-mono)}
.caret{transition:transform .15s;color:var(--muted)}
.topic.open .caret{transform:rotate(90deg)}

.tasks{display:grid;gap:6px;margin-top:8px}
.task{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.task input{margin-top:4px;accent-color:var(--ok);width:16px;height:16px;flex:none}
.task.done span{text-decoration:line-through;color:var(--muted)}
.task .k{font:600 .68rem var(--f-mono);color:var(--muted);display:block}

/* Plan */
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-bottom:14px;font-size:.82rem;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.calwrap{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(118px,1fr));gap:6px;min-width:860px}
.cal .dh{font:600 .72rem var(--f-mono);color:var(--muted);padding:0 4px}
.cell{--tc:var(--muted);position:relative;background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 16%,var(--surface)),var(--surface) 62%);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;min-height:138px;cursor:pointer;text-align:left;color:var(--fg)}
.cell:hover{border-color:var(--accent)}
.cell.full .f::after{content:"";}
.cell.past{opacity:.82}
.cell.today{outline:2px solid var(--accent);outline-offset:1px;opacity:1}
.cell.missed{border-color:var(--warn)}
.cell .d{display:flex;justify-content:space-between;font:600 .76rem var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.cell .d b{color:var(--fg)}
.cell .f{font:700 .84rem/1.25 var(--f-display)}
.cell .bars{display:flex;gap:2px;margin-top:auto}
.cell .bars i{height:5px;flex:1;border-radius:2px}
.cell .pb{height:4px;background:var(--idle);border-radius:2px;overflow:hidden}
.cell .pb b{display:block;height:100%;background:var(--ok)}
.mdot{position:absolute;top:8px;right:8px;width:10px;height:10px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 25%,transparent)}
.cell .mdot~.d span:last-child{margin-right:14px}

/* Topics */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center}
.filters input[type=search]{flex:1 1 200px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 11px;font-family:var(--f-mono);font-size:.85rem}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--raised);padding:7px 14px;border-radius:999px;cursor:pointer;font:600 .8rem var(--f-body);color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.track{margin-bottom:28px}
.trackhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 14px;margin-bottom:10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.trackhead h3{display:flex;align-items:center;gap:8px;font-size:1.15rem}
.trackhead .sm{font:500 .76rem var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}

/* Catch-up */
.miss{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.miss .mh{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px}
.miss ul{margin:0;padding-left:18px}
.miss li{margin-bottom:3px}
.miss .st{font:500 .74rem var(--f-mono);color:var(--warn)}

.empty{color:var(--muted)}
@media (max-width:720px){
  .tgrid{grid-template-columns:1fr}
  .topic .tright{flex-direction:column;align-items:flex-end;justify-content:center;padding-block:8px}
  .stage{padding:3px 5px}
  .addr{display:none}
  .chrome{justify-content:space-between}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<style>
.chip.core{color:var(--ok);border-color:var(--ok)}
.chip.stretch{color:var(--scripting);border-color:var(--scripting)}
.chip.skip{color:var(--muted)}
.why{border-left:3px solid var(--line);padding-left:10px;color:var(--fg)}
.layers{display:grid;gap:0;margin:8px 0 28px}
.layer{display:grid;grid-template-columns:44px 1fr;gap:0 14px}
.layer .rail{display:flex;flex-direction:column;align-items:center}
.layer .num{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font:700 .85rem var(--f-mono);color:var(--accent-ink);flex:none}
.layer .line{flex:1;width:2px;background:var(--line);margin:4px 0}
.layer:last-child .line{display:none}
.layer .lbody{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:12px;min-width:0}
.layer .lbody p{margin:4px 0 0;max-width:72ch}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin-top:8px;font-size:.88rem}
.kv dt{font:600 .7rem var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-top:3px}
.kv dd{margin:0;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:28px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-width:0}
.panel h3{margin-bottom:8px}
.panel ul{margin:0;padding-left:18px}
.panel li{margin-bottom:8px}
.panel li b{font-family:var(--f-display)}
.panel.do{border-top:3px solid var(--ok)}
.panel.dont{border-top:3px solid var(--t-red)}
.panel{border-radius:14px!important}
.pre{display:grid;grid-template-columns:1.2fr 1fr;gap:14px;margin-bottom:22px}
.pre .panel{min-width:0}
.big2{font:800 3rem/1 var(--f-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
@media (max-width:720px){.pre{grid-template-columns:1fr}}
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:28px}
.tiers .panel p{margin:4px 0 0;color:var(--muted)}
.tiers .big{font:700 1.6rem var(--f-display);font-variant-numeric:tabular-nums}
.sec{margin:34px 0 10px}
.idea{border-bottom:1px solid var(--line);padding:10px 0}
.idea:last-child{border-bottom:0}
.idea p{margin:2px 0 0;color:var(--muted);max-width:72ch}
@media (max-width:720px){.two,.tiers{grid-template-columns:1fr}}
</style>

<header class="top">
  <div class="wrap">
    <div class="chrome">
      <div class="lights" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="addr" aria-hidden="true"><span class="lock">●</span><span>https://fsd-sprint.dev/<b id="addrpath">roadmap</b></span></div>
      <div class="clock" id="clock" aria-live="off"><b>--:--</b>IST</div>
    </div>
    <div class="topin">
      <div class="brand"><h1>&lt;FSD <span>Sprint</span> /&gt;</h1><small id="countdown">1–30 Nov 2026 · SDE II</small></div>
      <div class="meter">
        <div class="row"><span>Core progress · <b id="pct">0%</b></span><span id="stagecount">0 / 0 stages</span></div>
        <div class="stack" id="stack" aria-hidden="true"></div>
      </div>
      <span class="sync" id="sync">saved on this device</span>
    </div>
    <nav class="tabs" aria-label="Views">
      <a href="#today">Today</a><a href="#catchup">Catch up <span class="badge" id="missbadge" hidden>0</span></a><a href="#roadmap">Roadmap</a><a href="#plan">30-day plan</a><a href="#topics">All topics</a><a href="#extras">Mocks &amp; blog ideas</a>

<main class="wrap" id="view"></main>

<script>
const GUIDE='https://allahabadi.dev/frontend-system-design/';
const TRACKS=[
 {id:'F',name:'Interview framework',color:'--t-grey',
  why:'The round is scored on how you structure an answer, not on how many facts you know. Learning the frame first means you can sit an interview on day 1, and every later topic has a box to go into.',
  needs:'Nothing',unlocks:'Every other layer: each topic maps to one RADIO letter',skip:'Memorizing someone else’s template word for word. Make it yours.'},
 {id:'B',name:'How the browser runs it',color:'--t-blue',
  why:'This is the physics of the frontend. Rendering strategies, performance and smooth components all come down to what the browser does with HTML, CSS and JS. Learn it before you try to optimize anything.',
  needs:'Framework',unlocks:'Async JS, components, performance',skip:'Chromium source internals, GPU raster details, HTTP/3 packet formats.'},
 {id:'J',name:'JavaScript asynchronicity',color:'--t-amber',
  why:'Jank, race conditions, stale search results and frozen UIs are all event-loop problems. Every component you design later needs debounce, cancellation or yielding.',
  needs:'Browser pipeline (the frame)',unlocks:'Components, real-time data, INP',skip:'Node.js event-loop phases, libuv, generator trivia.'},
 {id:'I',name:'Building the interface',color:'--t-purple',
  why:'Observers, event delegation and accessibility are the raw tools components are built from. Learning them once avoids re-learning them inside each component.',
  needs:'Browser, async JS',unlocks:'Components',skip:'Every DOM API; forms you already ship at work.'},
 {id:'C',name:'Components',color:'--t-green',
  why:'Component design (LLD) is the most common SDE II round. It combines the three layers above into one answer: structure, state, API, performance and accessibility.',
  needs:'Browser, async, interface APIs',unlocks:'Case studies are built from these components',skip:'Simple widgets (carousel, tabs, date picker, rating). You can reason those out live.'},
 {id:'R',name:'Rendering strategies',color:'--t-cyan',
  why:'After components, zoom out to the page: where does HTML get built? This choice drives SEO, first paint and hydration cost. It needs the browser pipeline to make sense.',
  needs:'Browser pipeline',unlocks:'Performance, case-study architecture',skip:'Qwik/Astro internals, framework migration guides.'},
 {id:'S',name:'State & data',color:'--t-orange',
  why:'The “D” in RADIO. Most real bugs are data bugs: stale caches, duplicated state, lost messages. Studied after components so you know what the data is feeding.',
  needs:'Components, async JS',unlocks:'Case studies (feed, chat, cart all hinge on this)',skip:'Redux Toolkit API surface, GraphQL server code, backend databases.'},
 {id:'P',name:'Performance',color:'--t-red',
  why:'The “O” in RADIO, and it cuts across everything. It comes after rendering and data because you can only optimize a system you understand. With that base it’s mostly naming levers and measuring.',
  needs:'Browser, rendering, data',unlocks:'The optimization section of every answer',skip:'Bundler config keys, micro-benchmarks, obscure Lighthouse audits.'},
 {id:'A',name:'Architecture & production',color:'--t-teal',
  why:'Security, auth and microfrontends are what separate SDE II from SDE I. Studied late because they are short, and because microfrontends is already your strength to polish.',
  needs:'Everything above',unlocks:'Senior-level depth in follow-up questions',skip:'CI/CD tooling details, i18n libraries, cloud infrastructure.'},
 {id:'X',name:'Case studies',color:'--t-pink',
  why:'HLD questions combine every layer: components, rendering, data, performance, security. They come last because they reuse everything; doing them early would mean learning ten things at once.',
  needs:'All layers',unlocks:'Mock interviews',skip:'Backend capacity math (QPS, sharding). One line of awareness is enough in a frontend round.'}
];
// [id, track, title, hours, tier c/s/k, why, concepts, build, [q1,q2], url?]
const T=[

let dbRef=null, writing=false, pending=false, timer=null;
const syncEl=document.getElementById('sync');
function persist(){
  try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}
  if(!dbRef) return;
  clearTimeout(timer); timer=setTimeout(flush,700); syncEl.textContent='saving…';
}
async function flush(){
  if(writing){pending=true;return;}
  writing=true;
  try{await dbRef.set(JSON.parse(JSON.stringify(S))); syncEl.textContent='synced to your account';}
  catch(e){syncEl.textContent=e&&e.code==='invalid_argument'?'read-only: saved on this device':'offline: saved on this device';}
  writing=false; if(pending){pending=false;flush();}
}
(async()=>{
  try{
    const db=window.claude&&await window.claude.use('db');
    if(!db) return;
    dbRef=db.doc('tracker/state');
    const to=setTimeout(()=>{syncEl.textContent='account sync slow: saved on this device'},10000);
    let first=true;
    dbRef.onSnapshot(snap=>{
      if(snap.metadata.hasPendingWrites) return;
      if(!snap.metadata.fromCache) clearTimeout(to);
      if(snap.exists){const d=snap.data(); S={topics:{...(d.topics||{})},tasks:{...(d.tasks||{})}}; try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){} render();}
      else if(first && !snap.metadata.fromCache && (Object.keys(S.topics).length||Object.keys(S.tasks).length)){flush();}
      if(!snap.metadata.fromCache){first=false; syncEl.textContent='synced to your account';}
    },()=>{clearTimeout(to);syncEl.textContent='saved on this device';});
  }catch(e){}
})();

function dayItems(d){

}

function dayMissing(d){

  d.topics.forEach(id=>{const left=STAGES.filter(([k])=>!stageDone(id,k)).map(([,l])=>l); if(left.length) out.push({kind:'topic',id,label:TOPIC[id].title,left});});

  d.extra.forEach((x,i)=>{const id=d.date+'-x'+i; if(!S.tasks[id]) out.push({kind:'task',id,label:x});});
  return out;
}

    const t=todayISO(), past=d.date<t, missed=past&&dayMissing(d).length>0;
    const tc=d.topics.length?cvar(trackOf(TOPIC[d.topics[0]].track).color):(d.mocks.length?'var(--accent)':'var(--muted)');
    return `<button style="--tc:${tc}" class="cell ${d.kind==='work'?'work':'full'}${d.date===t?' today':''}${past?' past':''}${missed?' missed':''}" data-goto="${d.date}" aria-label="${fmtDate(d.date)}: ${esc(d.focus)}, ${p}% done${missed?', has missed items':''}">
      ${missed?'<span class="mdot" title="Missed items"></span>':''}
      <span class="d"><span><b>${d.date.slice(8)}</b> ${dow(d.date)}${past&&!missed?' ✓':''}</span><span>${fmtH(d.hrs)}h</span></span>
      <span class="f">${esc(d.focus)}</span>
      <span class="bars">${bars||`<i style="background:var(--idle)"></i>`}</span>
      <span class="pb"><b style="width:${p}%"></b></span></button>`;
  }).join('');
  return `<h2><em>30 days</em> of frontend system design.</h2>
   <p class="lede">Each card is tinted by the roadmap layer it covers; the hour count shows 4h days (leave and weekends) vs office evenings. A <b>yellow dot</b> marks a past day with unfinished items. Today has a blue outline. Click any day to open it.</p>
   ${missBanner()}
   <div class="legend">${TRACKS.map(t=>`<span><i class="dot" style="background:${cvar(t.color)}"></i>${esc(t.name)}</span>`).join('')}</div>
   <div class="calwrap"><div class="cal">${head}${cells}</div></div>`;
}

function viewTopics(){
  const q=filt.q.toLowerCase();
  const list=TOPICS.filter(t=>(filt.tier==='all'||t.tier===filt.tier)&&(!q||(t.title+' '+t.concepts+' '+t.why).toLowerCase().includes(q)));
  return `<h2><em>${TOPICS.length} topics</em>, ranked by what gets asked.</h2>
   <p class="lede">Every topic with its reason, depth, build and questions. Core is scheduled. Stretch is for buffer time. Skip is listed so you can stop worrying about it.</p>
   <div class="filters"><input type="search" id="q" placeholder="Search topics" value="${esc(filt.q)}" aria-label="Search topics">
     <div class="seg" role="group" aria-label="Tier">${[['core','Core'],['stretch','Stretch'],['skip','Skip'],['all','All']].map(([v,l])=>`<button data-tier="${v}" aria-pressed="${filt.tier===v}">${l}</button>`).join('')}</div>
     <button class="btn" data-expand="${openTopics.size?'none':'all'}">${openTopics.size?'Collapse all':'Expand all'}</button></div>
   ${TRACKS.map(tr=>{
     const ts=list.filter(t=>t.track===tr.id); if(!ts.length) return '';
     const core=CORE.filter(t=>t.track===tr.id); const p=core.length?Math.round(core.reduce((a,t)=>a+topicPct(t.id),0)/core.length*100):0;
     return `<section class="track"><div class="trackhead"><h3><i class="dot" style="background:${cvar(tr.color)}"></i>${esc(tr.name)}</h3><span class="sm">${core.length} core · ${p}% done</span></div>${ts.map(t=>topicCard(t)).join('')}</section>`;
   }).join('')||'<p class="empty">No topics match.</p>'}`;
}

function viewCatchup(){
  const md=missedDays(), t=todayISO();
  if(t<DAYS[0].date) return `<h2><em>Catch up</em> on what slipped.</h2><p class="lede">Nothing to catch up yet. The sprint starts on ${fmtDate(DAYS[0].date)}. Anything left unfinished on a past day will show up here with a yellow dot.</p>`;
  if(!md.length) return `<h2><em>Catch up</em> on what slipped.</h2>${missBanner()||'<p class="lede">Nothing missed so far.</p>'}`;
  const n=md.reduce((a,x)=>a+x.items.length,0);
  return `<h2><em>Catch up</em> on what slipped.</h2>
   <p class="lede"><b>${n} unfinished item${n>1?'s':''}</b> from past days, oldest first. Clear them in buffer time (the 28–29 Nov weekend has 2 hours set aside). Don’t double up an evening to catch up.</p>
   ${md.map(({d,items})=>`<div class="miss"><div class="mh"><h3>${fmtDate(d.date)} · ${esc(d.focus)}</h3><button class="btn sm" data-goto="${d.date}">Open day →</button></div>
     <ul>${items.map(it=>`<li>${esc(it.label)}${it.kind==='topic'?` <span class="st">missing: ${it.left.join(', ')}</span>`:''}</li>`).join('')}</ul></div>`).join('')}`;
}

function viewExtras(){
  return `<h2><em>Mocks</em> &amp; blog ideas.</h2>
   <p class="lede">Mocks are part of the plan. Blogs are optional: write one only on a leave day when the study block is done and you still have energy.</p>
   <h3 class="sec">Mock interviews (scheduled)</h3>
   <div class="panel">${MOCKS.map(m=>taskRow(m.id,m.t,m.date+' Nov')).join('')}</div>
   <h3 class="sec">Blog ideas (optional)</h3>
   <p class="lede">These are not summaries of what you study. Each one uses something only you have: your work, your side project, your measurements, or your mock experience.</p>
   <div class="panel">${BLOGS.map(([t,d],i)=>`<div class="idea">${taskRow('blogidea'+i,t,'')}<p>${esc(d)}</p></div>`).join('')}</div>`;
}

const ROUTES={today:viewToday,catchup:viewCatchup,roadmap:viewRoadmap,plan:viewPlan,topics:viewTopics,extras:viewExtras};
function route(){const h=(location.hash||'').slice(1);return ROUTES[h]?h:'today'}
function render(){
  const r=route(), ae=document.activeElement, keepId=ae&&ae.id, selStart=ae&&ae.selectionStart;
  document.querySelectorAll('nav.tabs a').forEach(a=>a.setAttribute('aria-current',a.getAttribute('href')==='#'+r?'page':'false'));
  $('#view').innerHTML=ROUTES[r]();
  header();
  if(keepId){const el=document.getElementById(keepId); if(el){el.focus(); try{if(selStart!=null)el.setSelectionRange(selStart,selStart)}catch(e){}}}
}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});

document.addEventListener('change',e=>{
  const s=e.target.dataset.stage, tk=e.target.dataset.task;
  if(s){const [id,k]=s.split(':'); tstate(id)[k]=e.target.checked; persist(); render();}
  if(tk){S.tasks[tk]=e.target.checked; persist(); render();}
});
let typeT=null;
document.addEventListener('input',e=>{
  const n=e.target.dataset.note, l=e.target.dataset.link;
  if(n){tstate(n).note=e.target.value; clearTimeout(typeT); typeT=setTimeout(persist,500);}
  if(l){const v=e.target.value.trim(); if(!v||safeUrl(v)){tstate(l).link=v; clearTimeout(typeT); typeT=setTimeout(()=>{persist();render()},900);}}
  if(e.target.id==='q'){filt.q=e.target.value; render();}
});
document.addEventListener('click',e=>{
  if(e.target.closest('[data-stop]')) return;
  const tg=e.target.closest('[data-toggle]');
  if(tg){const id=tg.dataset.toggle; openTopics.has(id)?openTopics.delete(id):openTopics.add(id); render(); return;}
  const dn=e.target.closest('[data-day]');
  if(dn){const v=dn.dataset.day; selDay=v==='today'?defaultDay():(+v<0?PRE:DAYS[+v].date); render(); window.scrollTo(0,0); return;}
  const go=e.target.closest('[data-goto]');
  if(go){selDay=go.dataset.goto; if(route()==='today') render(); else location.hash='today'; return;}
  const p=e.target.closest('[data-tier]');
  if(p){filt.tier=p.dataset.tier; render(); return;}
  const ex=e.target.closest('[data-expand]');
  if(ex){ if(ex.dataset.expand==='all') TOPICS.filter(t=>filt.tier==='all'||t.tier===filt.tier).forEach(t=>openTopics.add(t.id)); else openTopics.clear(); render(); }
});
document.addEventListener('keydown',e=>{
  const tg=e.target.closest&&e.target.closest('[data-toggle]');
  if(tg&&e.target===tg&&(e.key==='Enter'||e.key===' ')){e.preventDefault();tg.click();}
});
render();
</script>
</body>
</html>
